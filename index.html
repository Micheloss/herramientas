<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Herramientas · CyberForged</title>
<meta name="description" content="Todas las herramientas de los vídeos de CyberForged, con su enlace.">
<style>
  :root {
    --fondo: #0d1117; --tarjeta: #161b22; --borde: #30363d; --texto: #e6edf3; --suave: #8b949e;
    --acento: #f9e264; --enlace: #58a6ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--texto);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 28px 16px 60px; }
  h1 { font-size: 28px; line-height: 1.2; margin: 0 0 6px; }
  h1 span { color: var(--acento); }
  .sub { color: var(--suave); margin: 0 0 20px; }
  input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--borde);
    background: var(--tarjeta); color: var(--texto); font-size: 16px; margin-bottom: 18px; }
  input:focus { outline: 2px solid var(--enlace); border-color: transparent; }
  .lista { display: flex; flex-direction: column; gap: 12px; }
  .h { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 12px; padding: 16px; }
  .h.nueva { border-color: var(--acento); }
  .fila { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .nombre { font-size: 19px; font-weight: 700; margin: 0; }
  .fecha { color: var(--suave); font-size: 13px; white-space: nowrap; }
  .etq { display: inline-block; background: var(--acento); color: #111; font-size: 12px; font-weight: 700;
    border-radius: 999px; padding: 1px 8px; margin-left: 6px; vertical-align: 2px; }
  .que { margin: 6px 0 10px; }
  .repo { color: var(--suave); font-size: 13px; word-break: break-all; }
  a.boton { display: inline-block; margin-top: 10px; background: #238636; color: #fff; text-decoration: none;
    font-weight: 600; padding: 9px 14px; border-radius: 8px; }
  a.boton:active { transform: translateY(1px); }
  .vacio { color: var(--suave); text-align: center; padding: 30px 0; }
  footer { color: var(--suave); font-size: 13px; text-align: center; margin-top: 36px; }
</style>
</head>
<body>
<main>
  <h1>Herramientas de <span>CyberForged</span></h1>
  <p class="sub">Todas las herramientas de mis vídeos, con su enlace. La del último vídeo, arriba del todo.</p>
  <input id="buscar" type="search" placeholder="Busca una herramienta…" aria-label="Buscar una herramienta">
  <div id="lista" class="lista"><p class="vacio">Cargando…</p></div>
  <footer>Úsalas solo sobre lo que es tuyo o tienes permiso para probar.</footer>
</main>
<script>
(function () {
  var lista = document.getElementById("lista");
  var buscar = document.getElementById("buscar");
  var todas = [];
  function norm(s) {
    return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  }
  function fecha(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    return isNaN(d) ? "" : d.toLocaleDateString("es-ES", { day: "numeric", month: "short", year: "numeric" });
  }
  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }
  function pintar() {
    var q = norm(buscar.value);
    var vistas = todas.filter(function (h) {
      return !q || norm([h.nombre, h.que, h.repo, h.descripcion].join(" ")).indexOf(q) >= 0;
    });
    lista.textContent = "";
    if (!vistas.length) {
      lista.appendChild(el("p", "vacio", q ? "No hay ninguna con eso." : "Aún no hay herramientas."));
      return;
    }
    vistas.forEach(function (h, i) {
      var c = el("article", "h" + (i === 0 && !q ? " nueva" : ""));
      c.id = h.id || "";
      var fila = el("div", "fila");
      var n = el("h2", "nombre", h.nombre);
      if (i === 0 && !q) n.appendChild(el("span", "etq", "ÚLTIMO VÍDEO"));
      fila.appendChild(n);
      fila.appendChild(el("span", "fecha", fecha(h.fecha)));
      c.appendChild(fila);
      if (h.que) c.appendChild(el("p", "que", h.que));
      if (h.repo) c.appendChild(el("div", "repo", h.repo));
      var a = el("a", "boton", "Abrir la herramienta →");
      a.href = h.url; a.target = "_blank"; a.rel = "noopener";
      c.appendChild(a);
      lista.appendChild(c);
    });
  }
  buscar.addEventListener("input", pintar);
  fetch("herramientas.json", { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      todas = (d.herramientas || []).slice().sort(function (a, b) {
        return String(b.fecha || "").localeCompare(String(a.fecha || ""));
      });
      pintar();
      if (location.hash) {
        var t = document.getElementById(location.hash.slice(1));
        if (t) t.scrollIntoView();
      }
    })
    .catch(function () { lista.textContent = ""; lista.appendChild(el("p", "vacio", "No se pudo cargar la lista.")); });
})();
</script>
</body>
</html>
